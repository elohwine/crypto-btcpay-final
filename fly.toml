# fly.toml app configuration file generated for crypto-btcpay-final on 2025-11-10T08:18:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'crypto-btcpay-final'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
