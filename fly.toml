# Fly.io configuration for crypto-btcpay-final (combined frontend + API service)
# Generated for Magnum crypto deposit platform

app = "crypto-btcpay-final"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  API_PORT = "3001"
  BTCPAY_ENABLED = "false"
  SKIP_BTCPAY = "true"
  TRON_NETWORK = "shasta"
  TRON_PROVIDER_URL = "https://api.shasta.trongrid.io"
  TRON_USDT_DECIMALS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  # Use suspend to reduce idle cost; autostart true to resume on requests
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  # Give the proxy a hint for autosuspend/autostart behaviour:
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50
  # health check: keep it lightweight / fast
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

# VM sizing - updated to 512MB after scaling
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = "sh ./release.sh"
