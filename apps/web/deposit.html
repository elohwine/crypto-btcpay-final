<html><body style='background:#012;color:#fff;padding:20px'><h1>Create Deposit</h1><form id='f'><label>Currency <input name='currency' value='BTC'/></label><br/><label>Amount <input name='amount' value='0.0001'/></label><br/><button>Create</button></form><pre id='out'></pre><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const res=await fetch((window._API||'http://localhost:3001') + '/api/deposits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currency:fd.get('currency'),amount:fd.get('amount')})});document.getElementById('out').innerText=JSON.stringify(await res.json(),null,2)});</script></body></html>
