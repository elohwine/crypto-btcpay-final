<!DOCTYPE html>
<html>
<head>
    <title>USDT Deposit - Crypto Platform</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #012;
            color: #fff;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .wallet-section {
            background: #123;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-section {
            background: #234;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #456;
            background: #234;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #456;
            cursor: pointer;
        }
        button:hover {
            background: #567;
        }
        button:disabled {
            background: #345;
            cursor: not-allowed;
        }
        .connected {
            color: #0f0;
        }
        .error {
            color: #f00;
        }
        .success {
            color: #0f0;
        }
        #output {
            background: #123;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .address {
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 USDT Deposit Platform</h1>
        
        <!-- TronLink Wallet Connection -->
        <div class="wallet-section">
            <h2>🦊 Connect TronLink Wallet</h2>
            <div id="wallet-status">
                <p>Please connect your TronLink wallet to proceed with USDT deposits.</p>
                <button id="connect-wallet">Connect TronLink</button>
            </div>
            <div id="wallet-connected" style="display: none;">
                <p class="connected">✅ Wallet Connected</p>
                <p>Address: <span id="wallet-address" class="address"></span></p>
                <button id="disconnect-wallet">Disconnect</button>
            </div>
        </div>

        <!-- Deposit Form -->
        <div class="form-section">
            <h2>💰 Create USDT Deposit</h2>
            <form id="deposit-form">
                <div>
                    <label>Currency: </label>
                    <input name="currency" value="USDT" readonly style="background: #345;">
                </div>
                <div>
                    <label>Amount (USDT): </label>
                    <input name="amount" value="10" type="number" step="0.000001" min="0.000001" required>
                </div>
                <div>
                    <button type="submit" id="create-deposit" disabled>Connect Wallet First</button>
                </div>
            </form>
        </div>

        <!-- Output -->
        <div>
            <h3>📊 Response</h3>
            <div id="output">Ready to create deposit...</div>
        </div>
    </div>

    <script>
        let isWalletConnected = false;
        let walletAddress = '';

        // TronLink detection and connection
        async function connectTronLink() {
            try {
                if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                    throw new Error('TronLink wallet not detected. Please install TronLink extension.');
                }

                // Request account access
                await window.tronWeb.request({ method: 'tron_requestAccounts' });
                
                walletAddress = window.tronWeb.defaultAddress.base58;
                if (!walletAddress) {
                    throw new Error('No TronLink account connected. Please unlock your wallet.');
                }

                isWalletConnected = true;
                updateWalletUI();
                updateOutput(`✅ Connected to TronLink\nAddress: ${walletAddress}`, 'success');
            } catch (error) {
                updateOutput(`❌ Wallet connection failed: ${error.message}`, 'error');
            }
        }

        function disconnectWallet() {
            isWalletConnected = false;
            walletAddress = '';
            updateWalletUI();
            updateOutput('🔌 Wallet disconnected', 'info');
        }

        function updateWalletUI() {
            const connectSection = document.getElementById('wallet-status');
            const connectedSection = document.getElementById('wallet-connected');
            const depositButton = document.getElementById('create-deposit');

            if (isWalletConnected) {
                connectSection.style.display = 'none';
                connectedSection.style.display = 'block';
                document.getElementById('wallet-address').textContent = walletAddress;
                depositButton.disabled = false;
                depositButton.textContent = 'Create USDT Deposit';
            } else {
                connectSection.style.display = 'block';
                connectedSection.style.display = 'none';
                depositButton.disabled = true;
                depositButton.textContent = 'Connect Wallet First';
            }
        }

        function updateOutput(message, type = 'info') {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                success: '#0f0',
                error: '#f00',
                info: '#fff'
            };
            output.style.color = colors[type] || '#fff';
            output.textContent = `[${timestamp}] ${message}`;
        }

        // Deposit form submission
        async function createDeposit(event) {
            event.preventDefault();
            
            if (!isWalletConnected) {
                updateOutput('❌ Please connect your TronLink wallet first', 'error');
                return;
            }

            const formData = new FormData(event.target);
            const depositData = {
                currency: formData.get('currency'),
                amount: parseFloat(formData.get('amount')),
                walletAddress: walletAddress
            };

            updateOutput('🔄 Creating deposit...', 'info');

            try {
                const response = await fetch((window._API || 'http://localhost:3001') + '/api/deposits', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(depositData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    updateOutput(`✅ Deposit created successfully!\n\n${JSON.stringify(result, null, 2)}`, 'success');
                } else {
                    updateOutput(`❌ Deposit creation failed:\n\n${JSON.stringify(result, null, 2)}`, 'error');
                }
            } catch (error) {
                updateOutput(`❌ Network error: ${error.message}`, 'error');
            }
        }

        // Event listeners
        document.getElementById('connect-wallet').addEventListener('click', connectTronLink);
        document.getElementById('disconnect-wallet').addEventListener('click', disconnectWallet);
        document.getElementById('deposit-form').addEventListener('submit', createDeposit);

        // Check if TronLink is already connected on page load
        window.addEventListener('load', () => {
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                walletAddress = window.tronWeb.defaultAddress.base58;
                isWalletConnected = true;
                updateWalletUI();
                updateOutput(`🔗 TronLink already connected\nAddress: ${walletAddress}`, 'success');
            } else {
                updateOutput('🦊 Please connect your TronLink wallet to continue', 'info');
            }
        });
    </script>
</body>
</html>
